[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-access-intake"
version = "1.0.0"
description = "Durable model-assisted access request intake for human review"
requires-python = ">=3.10"
dependencies = ["jsonschema==4.25.1"]

[project.scripts]
access-intake = "access_intake.__main__:main"

[tool.setuptools.packages.find]
include = ["access_intake*"]

[tool.setuptools.package-data]
access_intake = ["resources/*", "web/*"]
